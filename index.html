<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT Web Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="newChatBtn" title="New chat" aria-label="New chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
      </button>

      <div class="model-dropdown-wrapper">
        <button class="model-btn" id="modelBtn" aria-expanded="false" aria-haspopup="true">
          <span id="currentModel">ChatGPT</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>

        <div class="model-menu" id="modelMenu">
          <div class="model-option active" data-model="ChatGPT (GPT-4o)">
            <div class="model-title">GPT-4o</div>
            <div class="model-desc">Great for most everyday tasks</div>
          </div>
          <div class="model-option" data-model="GPT-4o mini">
            <div class="model-title">GPT-4o mini</div>
            <div class="model-desc">Faster for everyday tasks</div>
          </div>
          <div class="model-option" data-model="Gemini 1.5 Flash">
            <div class="model-title">Gemini 1.5 Flash</div>
            <div class="model-desc">Google's fast multimodal model</div>
          </div>
          <div class="model-option" data-model="o1-preview">
            <div class="model-title">o1-preview</div>
            <div class="model-desc">Advanced reasoning and logic</div>
          </div>
        </div>
      </div>
    </div>

    <div class="topbar-right">
      <button class="btn btn-dark" id="loginBtn">Log in</button>
      <button class="btn btn-light" id="signupBtn">Sign up</button>
      <button class="icon-btn help" id="helpBtn" aria-label="Help" title="Help & FAQ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3" />
          <path d="M12 17h.01" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main" id="mainContainer">
    <!-- Chat conversation history -->
    <div class="chat-container" id="chat"></div>

    <!-- Center Hero (welcome state) -->
    <div class="hero" id="hero">
      <h1>What can I help with?</h1>
    </div>

    <!-- Composer Section -->
    <div class="composer-container" id="composerContainer">
      <!-- File attachment preview -->
      <div class="attachment-preview" id="attachmentPreview">
        <span class="file-name" id="fileName"></span>
        <button class="remove-attachment" id="removeAttachmentBtn" title="Remove">&times;</button>
      </div>

      <div class="composer">
        <input type="text" id="userInput" placeholder="Ask anything" aria-label="Ask anything" autocomplete="off">

        <input type="file" id="fileInput" style="display: none;" accept="image/*,.pdf,.txt,.doc,.docx">

        <div class="composer-actions">
          <div class="chips-left">
            <button class="chip" id="attachBtn" type="button" title="Attach file">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5" />
              </svg>
              <span>Attach</span>
            </button>

            <button class="chip" id="searchBtn" type="button" title="Search web">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M2 12h20" />
                <path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20" />
              </svg>
              <span>Search</span>
            </button>

            <button class="chip" id="reasonBtn" type="button" title="Deep reasoning">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18h6" />
                <path d="M10 22h4" />
                <path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2v.3h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z" />
              </svg>
              <span>Reason</span>
            </button>
          </div>

          <button class="voice-btn" id="voiceBtn" type="button" title="Voice or Send">
            <span class="voice-icon" id="voiceIcon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round">
                <path d="M4 10v4" />
                <path d="M8 6v12" />
                <path d="M12 3v18" />
                <path d="M16 8v8" />
                <path d="M20 11v2" />
              </svg>
            </span>
            <span class="voice-label">Voice</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Suggestions (Quick Prompts) -->
    <div class="suggestions" id="suggestions">
      <button class="pill" data-prompt="Make a detailed 3-step action plan to learn Web Development in 30 days">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e5b800" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6" />
          <path d="M10 22h4" />
          <path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2v.3h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z" />
        </svg>
        Make a plan
      </button>

      <button class="pill" data-prompt="Help me write a professional follow-up email after a job interview">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c45ec4" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
        Help me write
      </button>

      <button class="pill" data-prompt="How does computer vision analyze images and recognize objects in photos?">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#5a5adf" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
        Analyze images
      </button>

      <button class="pill" data-prompt="Brainstorm 5 innovative startup ideas combining AI and green energy">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e5b800" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 18h6" />
          <path d="M10 22h4" />
          <path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2v.3h6v-.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z" />
        </svg>
        Brainstorm
      </button>

      <div class="more-dropdown-wrapper">
        <button class="pill" id="moreBtn">More</button>
        <div class="more-menu" id="moreMenu">
          <button class="more-item" data-prompt="Explain quantum computing like I'm 10 years old">Explain a concept</button>
          <button class="more-item" data-prompt="Write a Python script to scrape top news headlines">Code helper</button>
          <button class="more-item" data-prompt="Summarize the key principles of modern web design">Summarize</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Auth Modal -->
  <div class="modal-backdrop" id="authModal">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">&times;</button>
      <h2 id="modalTitle">Welcome to ChatGPT</h2>
      <p id="modalSubtitle">Log in with your OpenAI account</p>

      <form id="authForm" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label for="emailInput">Email address</label>
          <input type="email" id="emailInput" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="passwordInput">Password</label>
          <input type="password" id="passwordInput" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-dark full-width" id="modalSubmitBtn">Continue</button>
      </form>

      <div class="modal-footer">
        <span id="modalToggleText">Don't have an account?</span>
        <button class="text-btn" id="modalToggleBtn">Sign up</button>
      </div>
    </div>
  </div>

  <!-- Voice Active Overlay -->
  <div class="voice-overlay" id="voiceOverlay">
    <div class="voice-overlay-content">
      <div class="voice-waves">
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
        <div class="wave"></div>
      </div>
      <p class="voice-status" id="voiceStatus">Listening... Speak now</p>
      <button class="btn btn-dark" id="stopVoiceBtn">Done</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
