<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #ffffff;
      --text-main: #0d0d0d;
      --text-muted: #676767;
      --text-subtle: #8e8e8e;
      --border-light: #e5e5e5;
      --border-hover: #d1d5db;
      --bubble-user: #f4f4f4;
      --hover-bg: #f9f9f9;
      --chip-bg: #ffffff;
      --primary-black: #0d0d0d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      color: inherit;
      background: none;
      border: none;
    }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      position: sticky;
      top: 0;
      background: #ffffff;
      z-index: 50;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease;
    }

    .topbar.scrolled {
      border-bottom-color: var(--border-light);
    }

    .topbar-left,
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      color: #4b5563;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .icon-btn:hover {
      background: #f3f4f6;
      color: #111827;
    }

    .model-dropdown-wrapper {
      position: relative;
    }

    .model-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
      font-weight: 600;
      color: #374151;
      padding: 6px 10px;
      border-radius: 8px;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .model-btn:hover {
      background: #f3f4f6;
      color: #111827;
    }

    .model-menu {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 260px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 100;
    }

    .model-menu.open {
      display: flex;
    }

    .model-option {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .model-option:hover {
      background: #f3f4f6;
    }

    .model-option.active {
      background: #f3f4f6;
    }

    .model-option .model-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
    }

    .model-option .model-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn {
      font-size: 13px;
      font-weight: 600;
      padding: 8px 15px;
      border-radius: 9999px;
      transition: all 0.15s ease;
    }

    .btn-dark {
      background: var(--primary-black);
      color: #ffffff;
      border: 1px solid var(--primary-black);
    }

    .btn-dark:hover {
      background: #2b2b2b;
      border-color: #2b2b2b;
    }

    .btn-light {
      background: #ffffff;
      color: var(--primary-black);
      border: 1px solid var(--border-light);
      font-weight: 500;
    }

    .btn-light:hover {
      background: #f5f5f5;
      border-color: var(--border-hover);
    }

    /* ---------- Main Container ---------- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px 40px;
      max-width: 820px;
      margin: 0 auto;
      width: 100%;
      position: relative;
      transition: all 0.3s ease;
    }

    /* Hero Section (Welcome) */
    .hero {
      text-align: center;
      margin-bottom: 24px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .hero h1 {
      font-size: 30px;
      font-weight: 500;
      color: #0d0d0d;
      letter-spacing: -0.02em;
    }

    /* ---------- Composer Section ---------- */
    .composer-container {
      width: 100%;
      max-width: 680px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 40;
    }

    .attachment-preview {
      display: none;
      align-items: center;
      gap: 8px;
      background: #f3f4f6;
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 12px;
      color: #374151;
      width: fit-content;
    }

    .attachment-preview.show {
      display: flex;
    }

    .attachment-preview .remove-attachment {
      font-size: 16px;
      color: #9ca3af;
      cursor: pointer;
    }

    .attachment-preview .remove-attachment:hover {
      color: #111827;
    }

    .composer {
      background: #ffffff;
      border-radius: 24px;
      padding: 14px 14px 12px 18px;
      border: 1px solid var(--border-light);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .composer:focus-within {
      border-color: var(--border-hover);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    .composer input {
      width: 100%;
      border: none;
      outline: none;
      font-size: 15px;
      background: transparent;
      color: #111827;
      padding: 4px 0 14px 0;
      line-height: 1.4;
    }

    .composer input::placeholder {
      color: var(--text-subtle);
    }

    .composer-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .chips-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 11px;
      background: var(--chip-bg);
      border: 1px solid var(--border-light);
      border-radius: 9999px;
      color: #374151;
      transition: all 0.15s ease;
    }

    .chip:hover {
      background: #f3f4f6;
      border-color: var(--border-hover);
    }

    .chip.active {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #1d4ed8;
    }

    #reasonBtn.chip.active {
      background: #f5f3ff;
      border-color: #c4b5fd;
      color: #6d28d9;
    }

    .voice-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--primary-black);
      color: #ffffff;
      border-radius: 9999px;
      padding: 8px 14px;
      font-size: 12.5px;
      font-weight: 600;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .voice-btn:hover {
      background: #2a2a2a;
      transform: translateY(-1px);
    }

    .voice-btn.send-mode {
      padding: 8px 14px;
      background: #0d0d0d;
    }

    .voice-btn.active {
      background: #ef4444;
      animation: pulse-voice 1.5s infinite;
    }

    @keyframes pulse-voice {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }

      100% {
        transform: scale(1);
      }
    }

    /* ---------- Suggestion Pills ---------- */
    .suggestions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
      max-width: 680px;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 450;
      padding: 8px 15px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 9999px;
      color: #374151;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .pill:hover {
      background: #f9fafb;
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .more-dropdown-wrapper {
      position: relative;
    }

    .more-menu {
      position: absolute;
      bottom: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      width: 180px;
      z-index: 100;
    }

    .more-menu.open {
      display: flex;
    }

    .more-item {
      text-align: left;
      padding: 8px 12px;
      font-size: 13px;
      color: #374151;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .more-item:hover {
      background: #f3f4f6;
      color: #111827;
    }

    /* ---------- Active Chat Mode Layout ---------- */
    .main.chatting {
      justify-content: flex-start;
      padding-bottom: 120px;
    }

    .main.chatting .hero,
    .main.chatting .suggestions {
      display: none;
    }

    .main.chatting .composer-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 720px;
      width: calc(100% - 32px);
      background: transparent;
    }

    .chat-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 10px;
    }

    /* Message Styles */
    .msg-wrapper {
      display: flex;
      width: 100%;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg-wrapper.user {
      justify-content: flex-end;
    }

    .msg-wrapper.bot {
      justify-content: flex-start;
    }

    .msg-bubble {
      max-width: 80%;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.6;
    }

    .msg-wrapper.user .msg-bubble {
      background: var(--bubble-user);
      color: #0d0d0d;
      border-bottom-right-radius: 6px;
    }

    .msg-wrapper.bot .bot-container {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      max-width: 90%;
      width: 100%;
    }

    .bot-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #10a37f;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .bot-content {
      flex: 1;
      font-size: 15px;
      line-height: 1.65;
      color: #111827;
    }

    .bot-content p {
      margin-bottom: 12px;
    }

    .bot-content p:last-child {
      margin-bottom: 0;
    }

    .bot-content ul,
    .bot-content ol {
      margin: 8px 0 12px 20px;
    }

    .bot-content li {
      margin-bottom: 6px;
    }

    .bot-content code {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13.5px;
      color: #c026d3;
    }

    .bot-content pre {
      background: #1e1e1e;
      color: #f8f8f2;
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 12px 0;
      position: relative;
    }

    .bot-content pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    .reasoning-box {
      background: #f8fafc;
      border-left: 3px solid #8b5cf6;
      padding: 10px 14px;
      border-radius: 4px 8px 8px 4px;
      margin-bottom: 12px;
      font-size: 13.5px;
      color: #4b5563;
    }

    .search-sources {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 4px 8px;
      border-radius: 9999px;
      border: 1px solid #bfdbfe;
    }

    /* Typing Indicator */
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 8px 0;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: #9ca3af;
      border-radius: 50%;
      animation: dotBounce 1.2s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes dotBounce {

      0%,
      80%,
      100% {
        transform: scale(0.6);
        opacity: 0.5;
      }

      40% {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    /* ---------- Modal Styles ---------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
      backdrop-filter: blur(2px);
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 400px;
      width: 100%;
      position: relative;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 24px;
      color: #9ca3af;
      cursor: pointer;
      line-height: 1;
    }

    .modal-close:hover {
      color: #111827;
    }

    .modal-box h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .modal-box p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #374151;
    }

    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-group input:focus {
      border-color: var(--primary-black);
    }

    .btn.full-width {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      font-size: 14px;
    }

    .modal-footer {
      margin-top: 20px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .text-btn {
      color: var(--primary-black);
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }

    /* ---------- Voice Overlay ---------- */
    .voice-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13, 13, 13, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 250;
      color: #ffffff;
    }

    .voice-overlay.open {
      display: flex;
    }

    .voice-overlay-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .voice-waves {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 60px;
    }

    .wave {
      width: 6px;
      height: 20px;
      background: #ffffff;
      border-radius: 3px;
      animation: waveMotion 1s infinite ease-in-out;
    }

    .wave:nth-child(1) {
      animation-delay: 0.1s;
    }

    .wave:nth-child(2) {
      animation-delay: 0.25s;
    }

    .wave:nth-child(3) {
      animation-delay: 0.4s;
    }

    .wave:nth-child(4) {
      animation-delay: 0.2s;
    }

    .wave:nth-child(5) {
      animation-delay: 0.35s;
    }

    @keyframes waveMotion {

      0%,
      100% {
        height: 16px;
      }

      50% {
        height: 55px;
        background: #10a37f;
      }
    }

    .voice-status {
      font-size: 18px;
      font-weight: 500;
    }

    /* ---------- Responsive ---------- */
    @media (max-width: 600px) {
      .hero h1 {
        font-size: 24px;
      }

      .chips-left {
        gap: 4px;
      }

      .chip span {
        display: none;
      }

      .chip {
        padding: 7px 8px;
      }

      .suggestions {
        gap: 6px;
      }

      .pill {
        font-size: 12px;
        padding: 7px 12px;
      }
    }
  </style>
</head>

<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" id="newChatBtn" title="New chat" aria-label="New chat">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />
        </svg>
      </button>

      <div class="model-dropdown-wrapper">
        <button class="model-btn" id="modelBtn" aria-expanded="false" aria-haspopup="true">
          <span id="currentModel">ChatGPT</span>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>

        <div class="model-menu" id="modelMenu">
          <div class="model-option active" data-model="ChatGPT">
            <div class="model-title">GPT-4o</div>
            <div class="model-desc">Great for most everyday tasks</div>
          </div>
          <div class="model-option" data-model="GPT-4o mini">
            <div class="model-title">GPT-4o mini</div>
            <div class="model-desc">Faster for everyday tasks</div>
          </div>
          <div class="model-option" data-model="o1-preview">
            <div class="model-title">o1-preview</div>
            <div class="model-desc">Advanced reasoning and logic</div>
          </div>
        </div>
      </div>
    </div>

    <div class="topbar-right">
      <button class="btn btn-dark" id="loginBtn">Log in</button>
      <button class="btn btn-light" id="signupBtn">Sign up</button>
      <button class="icon-btn help" id="helpBtn" aria-label="Help" title="Help & FAQ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3" />
          <path d="M12 17h.01" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main" id="mainContainer">
    <!-- Chat conversation history -->
    <div class="chat-container" id="chat"></div>

    <!-- Center Hero (welcome state) -->
    <div class="hero" id="hero">
      <h1>What can I help with?</h1>
    </div>

    <!-- Composer Section -->
    <div class="composer-container" id="composerContainer">
      <!-- File attachment preview -->
      <div class="attachment-preview" id="attachmentPreview">
        <span class="file-name" id="fileName"></span>
        <button class="remove-attachment" id="removeAttachmentBtn" title="Remove">&times;</button>
      </div>

      <div class="composer">
        <input type="text" id="userInput" placeholder="Ask anything" aria-label="Ask anything" autocomplete="off">

        <input type="file" id="fileInput" style="display: none;" accept="image/*,.pdf,.txt,.doc,.docx">

        <div class="composer-actions">
          <div class="chips-left">
            <button class="chip" id="attachBtn" type="button" title="Attach file">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="m21.4 11.1-9.2 9.2a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.5-8.5" />
              </svg>
              <span>Attach</span>
            </button>

            <button class="chip" id="searchBtn" type="button" title="Search web">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10" />
                <path d="M2 12h20" />
                <path d="M12 2a15 15 0 0 1 0 20 15 15 0 0 1 0-20" />
              </svg>
              <span>Search</span>
            </button>

            <button class="chip" id="reasonBtn" type="button" title="Deep reasoning">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18h6" />
                <path d="M10 22h4" />

  <!-- Complete Inlined Logic: 100% self-contained single-file working app -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Elements
      const mainContainer = document.getElementById("mainContainer");
      const chat = document.getElementById("chat");
      const hero = document.getElementById("hero");
      const suggestions = document.getElementById("suggestions");
      const userInput = document.getElementById("userInput");
      const voiceBtn = document.getElementById("voiceBtn");
      const voiceIcon = document.getElementById("voiceIcon");
      const voiceLabel = document.querySelector(".voice-label");
      const newChatBtn = document.getElementById("newChatBtn");

      // Model Menu
      const modelBtn = document.getElementById("modelBtn");
      const modelMenu = document.getElementById("modelMenu");
      const currentModel = document.getElementById("currentModel");

      // Chips
      const attachBtn = document.getElementById("attachBtn");
      const searchBtn = document.getElementById("searchBtn");
      const reasonBtn = document.getElementById("reasonBtn");
      const fileInput = document.getElementById("fileInput");
      const attachmentPreview = document.getElementById("attachmentPreview");
      const fileNameSpan = document.getElementById("fileName");
      const removeAttachmentBtn = document.getElementById("removeAttachmentBtn");

      // Suggestion Pills & More Menu
      const pills = document.querySelectorAll(".pill[data-prompt]");
      const moreBtn = document.getElementById("moreBtn");
      const moreMenu = document.getElementById("moreMenu");
      const moreItems = document.querySelectorAll(".more-item");

      // Auth Modal
      const loginBtn = document.getElementById("loginBtn");
      const signupBtn = document.getElementById("signupBtn");
      const helpBtn = document.getElementById("helpBtn");
      const authModal = document.getElementById("authModal");
      const modalClose = document.getElementById("modalClose");
      const modalTitle = document.getElementById("modalTitle");
      const modalSubtitle = document.getElementById("modalSubtitle");
      const modalSubmitBtn = document.getElementById("modalSubmitBtn");
      const modalToggleBtn = document.getElementById("modalToggleBtn");
      const modalToggleText = document.getElementById("modalToggleText");
      const authForm = document.getElementById("authForm");

      // Voice Overlay
      const voiceOverlay = document.getElementById("voiceOverlay");
      const stopVoiceBtn = document.getElementById("stopVoiceBtn");
      const voiceStatus = document.getElementById("voiceStatus");

      // State
      let attachedFile = null;
      let isListening = false;
      let selectedModel = "ChatGPT (GPT-4o)";
      let isAuthLogin = true;

      // SVG Icons
      const voiceSvg = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M4 10v4"/><path d="M8 6v12"/><path d="M12 3v18"/><path d="M16 8v8"/><path d="M20 11v2"/>
        </svg>
      `;

      const sendSvg = `
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>
        </svg>
      `;

      const botAvatarSvg = `
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor">
          <path d="M22.28 10.37c-.17-.7-.52-1.34-1.01-1.85-.02-.38-.1-.76-.23-1.12a5.45 5.45 0 0 0-2.83-3.14 5.37 5.37 0 0 0-4.05-.18 5.42 5.42 0 0 0-3.66-1.57c-2.45 0-4.57 1.62-5.23 3.99a5.4 5.4 0 0 0-3.32 2.39 5.42 5.42 0 0 0 .52 5.92c-.17.7-.17 1.45 0 2.15.2.7.55 1.34 1.04 1.85.02.38.1.76.23 1.12a5.44 5.44 0 0 0 2.83 3.14 5.37 5.37 0 0 0 4.05.18 5.42 5.42 0 0 0 3.66 1.57c2.45 0 4.57-1.62 5.23-3.99a5.4 5.4 0 0 0 3.32-2.39 5.42 5.42 0 0 0-.54-5.92c.18-.7.18-1.45 0-2.15l-.04-.15zm-8.87 11.02a3.86 3.86 0 0 1-2.44-.86l.12-.07 4.06-2.34a.8.8 0 0 0 .4-.69v-5.71l1.71.99a.08.08 0 0 1 .04.06v5.27a3.89 3.89 0 0 1-3.89 3.35zm-8.11-4.08a3.88 3.88 0 0 1-.5-2.54c.05.02.1.05.16.08l4.06 2.34c.24.14.54.14.78 0l4.95-2.85v1.98a.07.07 0 0 1-.03.06l-4.56 2.63a3.89 3.89 0 0 1-4.86-1.7zm-1.12-8.31c.32-.73.84-1.36 1.5-1.8l-.06.12v4.69a.8.8 0 0 0 .4.69l4.95 2.85-1.71.99a.08.08 0 0 1-.07 0l-4.56-2.63a3.89 3.89 0 0 1-.45-4.91zm14.19 3.23-4.95-2.86 1.71-.99a.08.08 0 0 1 .07 0l4.56 2.63a3.89 3.89 0 0 1-.47 6.71l-.1-.05-4.06-2.35a.8.8 0 0 0-.76 0v-3.09zm2.46-3.82c-.05-.03-.1-.05-.16-.08l-4.06-2.34a.79.79 0 0 0-.78 0l-4.95 2.85v-1.98a.07.07 0 0 1 .03-.06l4.56-2.63a3.89 3.89 0 0 1 5.36 4.24zm-8.83-2.14 4.06 2.35a.8.8 0 0 0 .78 0v4.69l-.12-.07-4.06-2.34a.8.8 0 0 0-.78 0l-4.95 2.85v-1.98l4.56-2.63a3.89 3.89 0 0 1 .51-2.87z"/>
        </svg>
      `;

      // Update Voice / Send Button based on input
      function updateComposerButton() {
        const hasText = userInput.value.trim().length > 0 || attachedFile !== null;
        if (hasText) {
          voiceIcon.innerHTML = sendSvg;
          voiceLabel.textContent = "Send";
          voiceBtn.classList.add("send-mode");
          voiceBtn.title = "Send message";
        } else {
          voiceIcon.innerHTML = voiceSvg;
          voiceLabel.textContent = "Voice";
          voiceBtn.classList.remove("send-mode");
          voiceBtn.title = "Voice input";
        }
      }

      // Switch to Chat Layout
      function activateChatMode() {
        mainContainer.classList.add("chatting");
        if (hero) hero.style.display = "none";
        if (suggestions) suggestions.style.display = "none";
      }

      // Reset chat to Welcome state
      function resetChat() {
        chat.innerHTML = "";
        userInput.value = "";
        removeAttachment();
        mainContainer.classList.remove("chatting");
        if (hero) hero.style.display = "block";
        if (suggestions) suggestions.style.display = "flex";
        updateComposerButton();
        userInput.focus();
      }

      // Scroll chat to bottom
      function scrollToBottom() {
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth"
        });
      }

      // Add User Message
      function addUserMessage(text, file) {
        const msgWrapper = document.createElement("div");
        msgWrapper.className = "msg-wrapper user";

        let fileHtml = "";
        if (file) {
          fileHtml = `<div style="font-size: 12px; font-weight: 500; margin-bottom: 6px; padding: 4px 8px; background: rgba(0,0,0,0.06); border-radius: 6px; display: inline-flex; align-items: center; gap: 4px;">📎 ${escapeHtml(file.name)}</div><br>`;
        }

        msgWrapper.innerHTML = `
          <div class="msg-bubble">
            ${fileHtml}
            ${escapeHtml(text)}
          </div>
        `;

        chat.appendChild(msgWrapper);
        scrollToBottom();
      }

      // Add Bot Typing Indicator
      function addTypingIndicator() {
        const msgWrapper = document.createElement("div");
        msgWrapper.className = "msg-wrapper bot typing-indicator-wrapper";
        msgWrapper.innerHTML = `
          <div class="bot-container">
            <div class="bot-avatar">${botAvatarSvg}</div>
            <div class="bot-content">
              <div class="typing-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
              </div>
            </div>
          </div>
        `;
        chat.appendChild(msgWrapper);
        scrollToBottom();
        return msgWrapper;
      }

      // Render Bot Message with Typewriter Streaming Effect
      function streamBotResponse(fullText, meta = {}) {
        const msgWrapper = document.createElement("div");
        msgWrapper.className = "msg-wrapper bot";

        let metaHtml = "";
        if (meta.reasoning) {
          metaHtml += `
            <div class="reasoning-box">
              <strong>Thought for 2 seconds</strong><br>
              <span style="font-size: 12.5px; color: #6b7280;">• Analyzed context and user requirements<br>• Structured clear step-by-step guidance</span>
            </div>
          `;
        }

        if (meta.search) {
          metaHtml += `
            <div class="search-sources">
              <span class="source-badge">🌐 web.dev</span>
              <span class="source-badge">🌐 MDN Web Docs</span>
              <span class="source-badge">🌐 GitHub</span>
            </div>
          `;
        }

        const container = document.createElement("div");
        container.className = "bot-container";
        container.innerHTML = `
          <div class="bot-avatar">${botAvatarSvg}</div>
          <div class="bot-content">
            ${metaHtml}
            <div class="text-stream"></div>
          </div>
        `;
        msgWrapper.appendChild(container);
        chat.appendChild(msgWrapper);

        const streamTarget = container.querySelector(".text-stream");
        let index = 0;
        const speed = 12; // ms per chunk

        function typeNextChunk() {
          if (index < fullText.length) {
            const chunk = fullText.slice(0, index + 3);
            index += 3;
            streamTarget.innerHTML = formatMarkdown(chunk);
            scrollToBottom();
            setTimeout(typeNextChunk, speed);
          } else {
            streamTarget.innerHTML = formatMarkdown(fullText);
            scrollToBottom();
          }
        }

        typeNextChunk();
      }

      // Markdown Formatter
      function formatMarkdown(text) {
        let html = escapeHtml(text);
        // Bold
        html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
        // Code inline
        html = html.replace(/`(.*?)`/g, "<code>$1</code>");
        // Code blocks
        html = html.replace(/```([\s\S]*?)```/g, "<pre><code>$1</code></pre>");
        // Bullet lists
        html = html.replace(/^\s*[-•]\s+(.*)$/gm, "<li>$1</li>");
        html = html.replace(/(<li>[\s\S]*?<\/li>)/g, "<ul>$1</ul>");
        // Paragraphs
        const paragraphs = html.split(/\n\n+/);
        return paragraphs.map(p => {
          if (p.startsWith("<ul>") || p.startsWith("<pre>")) return p;
          return `<p>${p.replace(/\n/g, "<br>")}</p>`;
        }).join("");
      }

      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      // Smart Context-Aware Bot Answer Generator
      function generateBotReply(prompt, hasFile, isReason, isSearch) {
        const lower = prompt.toLowerCase();

        if (lower.includes("plan") || lower.includes("learn web development")) {
          return `Here is a tailored **30-Day Web Development Mastery Plan**:\n\n` +
            `• **Week 1: Foundations** - HTML5 semantic structure, modern CSS layouts (Flexbox & Grid), responsive design principles.\n` +
            `• **Week 2: JavaScript Core** - DOM manipulation, event listeners, array methods, fetch API, and state handling.\n` +
            `• **Week 3: Interactive Web Apps** - Building interactive UIs (like this ChatGPT clone), local storage, and modular components.\n` +
            `• **Week 4: Deployment & Polish** - Git/GitHub version control, accessibility checks, and publishing to Vercel/GitHub Pages.\n\n` +
            `Would you like to start with day-by-day practice tasks or recommended resources?`;
        }

        if (lower.includes("write") || lower.includes("email") || lower.includes("follow-up")) {
          return `Here is a polite and professional follow-up email:\n\n` +
            `**Subject:** Thank You - Follow-Up on [Position Title] Interview\n\n` +
            `Dear [Interviewer's Name],\n\n` +
            `Thank you so much for taking the time to speak with me today about the [Position Title] role. I really enjoyed learning more about the team's upcoming initiatives and how this position contributes to your mission.\n\n` +
            `Our discussion further reinforced my enthusiasm for the role and my confidence that my skills in web development and problem-solving would make a positive impact.\n\n` +
            `Please let me know if you need any additional information from my side. I look forward to hearing about the next steps.\n\n` +
            `Warm regards,\n` +
            `[Your Name]`;
        }

        if (lower.includes("image") || lower.includes("vision") || lower.includes("photo")) {
          return `Computer vision models analyze images through a structured multi-layer pipeline:\n\n` +
            `1. **Feature Extraction:** Convolutional layers or Vision Transformers (ViT) scan pixel arrays for low-level features (edges, textures, colors).\n` +
            `2. **Pattern Recognition:** Higher layers combine edges into shapes, objects, textures, and facial geometries.\n` +
            `3. **Classification & Segmentation:** The neural network outputs high-confidence object boundaries and semantic descriptions.\n\n` +
            `You can use the **Attach** button to upload an image and test visual comprehension anytime!`;
        }

        if (lower.includes("brainstorm") || lower.includes("startup") || lower.includes("ideas")) {
          return `Here are **5 innovative AI + Green Energy startup ideas**:\n\n` +
            `1. **GridPulse AI:** Predictive load balancer forecasting microgrid renewable energy fluctuations with sub-minute precision.\n` +
            `2. **SolarSense Drone OS:** Autonomous drone computer vision detecting microscopic solar panel micro-cracks and dust degradation.\n` +
            `3. **EcoFleet Optimizer:** Real-time dynamic EV routing based on grid tariff lows and renewable surplus hours.\n` +
            `4. **CarbonTrace Copilot:** Automated ESG regulatory compliance auditing for supply chain emissions tracking.\n` +
            `5. **HomeWatt AI:** Smart residential breaker automation shifting high-draw appliances to solar peak hours.`;
        }

        if (lower.includes("quantum") || lower.includes("explain")) {
          return `Imagine a regular computer switch like a light switch: it can either be **OFF (0)** or **ON (1)**.\n\n` +
            `A **Quantum Computer** uses tiny particles that can be **both ON and OFF at the same time** (called *Superposition*), like a spinning coin in mid-air!\n\n` +
            `Because of this magic, it can test millions of maze pathways all at once, solving problems that would take supercomputers thousands of years in just seconds!`;
        }

        if (hasFile) {
          return `I received **${escapeHtml(attachedFile.name)}**!\n\n` +
            `I have processed the uploaded attachment alongside your query: *" ${prompt} "*.\n\n` +
            `The file is verified and parsed successfully. What specific insights, summaries, or actions would you like me to perform on this file?`;
        }

        // Default intelligent ChatGPT reply
        return `I can definitely help you with that!\n\n` +
          `Regarding **${escapeHtml(prompt)}**:\n\n` +
          `• **Key Takeaway:** Breaking complex goals into modular components ensures scalable results.\n` +
          `• **Implementation Tip:** Keep code clean, reusable, and responsive across all device sizes.\n\n` +
          `Feel free to ask follow-up questions, request code snippets, or explore alternative angles!`;
      }

      // Send Message Action
      function sendMessage() {
        const text = userInput.value.trim();
        if (!text && !attachedFile) return;

        activateChatMode();

        const currentFile = attachedFile;
        addUserMessage(text, currentFile);

        userInput.value = "";
        removeAttachment();
        updateComposerButton();

        // Check chips states
        const isReason = reasonBtn.classList.contains("active");
        const isSearch = searchBtn.classList.contains("active");

        const typingIndicator = addTypingIndicator();

        setTimeout(() => {
          typingIndicator.remove();
          const reply = generateBotReply(text, !!currentFile, isReason, isSearch);
          streamBotResponse(reply, { reasoning: isReason, search: isSearch });
        }, 700);
      }

      // File Attachment Handling
      function removeAttachment() {
        attachedFile = null;
        fileInput.value = "";
        attachmentPreview.classList.remove("show");
        fileNameSpan.textContent = "";
        updateComposerButton();
      }

      attachBtn.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", (e) => {
        if (e.target.files && e.target.files[0]) {
          attachedFile = e.target.files[0];
          fileNameSpan.textContent = attachedFile.name;
          attachmentPreview.classList.add("show");
          updateComposerButton();
          userInput.focus();
        }
      });

      removeAttachmentBtn.addEventListener("click", removeAttachment);

      // Chips Toggle (Search / Reason)
      [searchBtn, reasonBtn].forEach((chip) => {
        chip.addEventListener("click", () => {
          chip.classList.toggle("active");
        });
      });

      // Suggestion Pills Click
      pills.forEach((pill) => {
        pill.addEventListener("click", () => {
          const prompt = pill.getAttribute("data-prompt") || pill.textContent.trim();
          userInput.value = prompt;
          sendMessage();
        });
      });

      // More Menu
      moreBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        moreMenu.classList.toggle("open");
      });

      moreItems.forEach((item) => {
        item.addEventListener("click", () => {
          const prompt = item.getAttribute("data-prompt");
          moreMenu.classList.remove("open");
          userInput.value = prompt;
          sendMessage();
        });
      });

      // Model Menu
      modelBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        modelMenu.classList.toggle("open");
      });

      document.querySelectorAll(".model-option").forEach((opt) => {
        opt.addEventListener("click", () => {
          document.querySelectorAll(".model-option").forEach(o => o.classList.remove("active"));
          opt.classList.add("active");
          const modelName = opt.getAttribute("data-model");
          currentModel.textContent = modelName;
          selectedModel = modelName;
          modelMenu.classList.remove("open");
        });
      });

      // Close menus on outside click
      document.addEventListener("click", () => {
        modelMenu.classList.remove("open");
        moreMenu.classList.remove("open");
      });

      // Composer Input Events
      userInput.addEventListener("input", updateComposerButton);

      userInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });

      // Voice / Send Button Click
      voiceBtn.addEventListener("click", () => {
        if (userInput.value.trim() || attachedFile) {
          sendMessage();
          return;
        }
        // Open Voice Modal
        voiceOverlay.classList.add("open");
        voiceStatus.textContent = "Listening... Speak now";
        isListening = true;

        if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          const recognition = new SpeechRecognition();
          recognition.continuous = false;
          recognition.interimResults = false;
          recognition.lang = "en-US";

          recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            userInput.value = transcript;
            voiceOverlay.classList.remove("open");
            updateComposerButton();
            sendMessage();
          };

          recognition.onerror = () => {
            voiceStatus.textContent = "Listening simulated. Click Done to test.";
          };

          recognition.start();
        }
      });

      stopVoiceBtn.addEventListener("click", () => {
        voiceOverlay.classList.remove("open");
        if (!userInput.value.trim()) {
          userInput.value = "Hello ChatGPT, what can you do?";
          updateComposerButton();
          sendMessage();
        }
      });

      // New Chat Action
      newChatBtn.addEventListener("click", resetChat);

      // Auth Modal (Login & Signup)
      function openAuthModal(isLogin) {
        isAuthLogin = isLogin;
        modalTitle.textContent = isLogin ? "Welcome back" : "Create your account";
        modalSubtitle.textContent = isLogin ? "Log in to your ChatGPT account" : "Sign up to start chatting with ChatGPT";
        modalSubmitBtn.textContent = isLogin ? "Log in" : "Sign up";
        modalToggleText.textContent = isLogin ? "Don't have an account?" : "Already have an account?";
        modalToggleBtn.textContent = isLogin ? "Sign up" : "Log in";
        authModal.classList.add("open");
      }

      loginBtn.addEventListener("click", () => openAuthModal(true));
      signupBtn.addEventListener("click", () => openAuthModal(false));

      modalClose.addEventListener("click", () => authModal.classList.remove("open"));

      modalToggleBtn.addEventListener("click", () => openAuthModal(!isAuthLogin));

      authModal.addEventListener("click", (e) => {
        if (e.target === authModal) authModal.classList.remove("open");
      });

      authForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("emailInput").value;
        alert(`Success! Logged in as ${email}`);
        authModal.classList.remove("open");
      });

      helpBtn.addEventListener("click", () => {
        alert("ChatGPT Assistant Clone.\n\n• Type any query and press Enter to chat.\n• Use suggestion pills for quick prompts.\n• Toggle Attach, Search, or Reason chips for advanced modes.\n• Click New Chat icon to start fresh.");
      });

      // Initial focus
      userInput.focus();
    });
  </script>
</body>

</html>
